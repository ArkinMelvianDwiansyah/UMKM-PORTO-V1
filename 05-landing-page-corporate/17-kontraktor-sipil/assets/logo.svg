<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <!-- Geometric Industrial Emblem (Isometric Foundation & Crane Truss) -->
  <g transform="translate(4, 4)">
    <!-- Base Foundation Hexagon / Block -->
    <path d="M28 2L52 16V44L28 58L4 44V16L28 2Z" fill="#1E293B" stroke="#FACC15" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Inner Truss Lines (Safety Yellow & Steel) -->
    <path d="M28 2V30M52 16L28 30M4 16L28 30" stroke="#FACC15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 30V58M4 44L28 30M52 44L28 30" stroke="#EAB308" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Core Hub / Anchor Dot -->
    <circle cx="28" cy="30" r="4.5" fill="#FACC15" />
    <circle cx="28" cy="30" r="2" fill="#0F172A" />
  </g>

  <!-- Typography: BUMI KARYA KONSTRUKSI -->
  <text x="70" y="27" fill="#FFFFFF" font-family="'Barlow Condensed', 'Arial Black', sans-serif" font-size="24" font-weight="900" letter-spacing="1.5">BUMI KARYA</text>
  <text x="70" y="44" fill="#FACC15" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="2">KONSTRUKSI &amp; INFRASTRUKTUR</text>
  <rect x="70" y="50" width="180" height="2" fill="#334155" />
  <rect x="70" y="50" width="45" height="2" fill="#EAB308" />
</svg>
