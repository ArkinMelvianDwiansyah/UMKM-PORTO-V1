  <rect x="2" y="2" width="52" height="52" rx="10" fill="#122B22" stroke="#C85A32" stroke-width="1.5"/>
  <!-- Outer Compass Ring -->
  <circle cx="28" cy="28" r="19" stroke="#F7F4EE" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.5"/>
  <circle cx="28" cy="28" r="15" stroke="#C85A32" stroke-width="1.5"/>
  <!-- Cardinal Marks -->
  <path d="M28 9V13M28 43V47M9 28H13M43 28H47" stroke="#F7F4EE" stroke-width="1.5" stroke-linecap="round"/>
