  <text x="66" y="29" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#122B22" letter-spacing="-0.2">Jelajah<tspan fill="#C85A32">Nusa</tspan></text>
  <text x="67" y="44" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="700" fill="#4A5D54" letter-spacing="1.8">TRANSPORT &amp; HERITAGE TOUR</text>
