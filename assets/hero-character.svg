<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540" width="100%" height="100%">
  <defs>
    <!-- Skin 3D Gradients -->
    <radialGradient id="skinGrad" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#FFF5EC"/>
      <stop offset="55%" stop-color="#FCD9C4"/>
      <stop offset="85%" stop-color="#F3BFA0"/>
      <stop offset="100%" stop-color="#EAA681"/>
    </radialGradient>
    <radialGradient id="handSkin" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF3E8"/>
      <stop offset="60%" stop-color="#FCD5BE"/>
      <stop offset="100%" stop-color="#EAA681"/>
    </radialGradient>
    <radialGradient id="earGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE8D8"/>
      <stop offset="70%" stop-color="#F6BC9B"/>
      <stop offset="100%" stop-color="#E29A74"/>
    </radialGradient>
    <radialGradient id="cheekBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5252" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#FF7575" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF7575" stop-opacity="0"/>
    </radialGradient>

    <!-- Hair 3D Multi-Tone Gradients -->
    <linearGradient id="hairBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28221D"/>
      <stop offset="50%" stop-color="#1A1613"/>
      <stop offset="100%" stop-color="#0E0C0A"/>
    </linearGradient>
    <linearGradient id="hairMid" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#423830"/>
      <stop offset="55%" stop-color="#2A231E"/>
      <stop offset="100%" stop-color="#14110E"/>
    </linearGradient>
    <linearGradient id="hairHighlight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#5C5046"/>
      <stop offset="50%" stop-color="#786A5E"/>
      <stop offset="100%" stop-color="#3D342C"/>
    </linearGradient>
    <linearGradient id="hairStrandL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3F36"/>
      <stop offset="60%" stop-color="#2C2520"/>
      <stop offset="100%" stop-color="#15120F"/>
    </linearGradient>
    <linearGradient id="hairStrandR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#55493F"/>
      <stop offset="60%" stop-color="#322A23"/>
      <stop offset="100%" stop-color="#15120F"/>
    </linearGradient>

    <!-- Eyes Realistic Gradients -->
    <radialGradient id="irisGrad" cx="40%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#7C4322"/>
      <stop offset="40%" stop-color="#522A15"/>
      <stop offset="80%" stop-color="#281207"/>
      <stop offset="100%" stop-color="#0F0603"/>
    </radialGradient>

    <!-- Hoodie 3D Rich Emerald Gradients -->
    <linearGradient id="hoodieBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="30%" stop-color="#059669"/>
      <stop offset="80%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="hoodieSleeve" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="hoodieCollar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="hoodieInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#023E2C"/>
    </linearGradient>
    <linearGradient id="stringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Glasses Glare -->
    <linearGradient id="lensGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="charDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#064E3B" flood-opacity="0.13"/>
    </filter>

    <style>
      .char-root {
        transform-origin: 240px 380px;
        animation: floatIdle 4s ease-in-out infinite;
      }
      .head-group {
        transform-origin: 240px 240px;
        animation: headTilt 6s ease-in-out infinite;
      }
      .eye-blink-wrapper {
        transform-origin: 0px 0px;
        animation: naturalBlink 4.2s ease-in-out infinite;
      }
      .hand-wave-group {
        transform-origin: 360px 380px;
        animation: armSway 4s ease-in-out infinite;
      }
      .hand-palm {
        transform-origin: 405px 260px;
        animation: friendlyPalmWave 3.2s ease-in-out infinite;
      }
      .string-l {
        transform-origin: 208px 390px;
        animation: swayL 4s ease-in-out infinite;
      }
      .string-r {
        transform-origin: 272px 390px;
        animation: swayR 4s ease-in-out infinite 0.5s;
      }
      .glare-sweep {
        animation: glareShift 4.5s ease-in-out infinite;
      }
      .spark-1 { animation: sparkBob 3.5s ease-in-out infinite; }
      .spark-2 { animation: sparkBob 4s ease-in-out infinite 0.8s; }

      @keyframes floatIdle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes headTilt {
        0%, 100% { transform: rotate(0deg); }
        35% { transform: rotate(0.8deg); }
        70% { transform: rotate(-0.8deg); }
      }
      @keyframes naturalBlink {
        0%, 93%, 97%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.08); }
      }
      @keyframes armSway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-1.5deg); }
      }
      @keyframes friendlyPalmWave {
        0%, 100% { transform: rotate(0deg); }
        12% { transform: rotate(-9deg); }
        24% { transform: rotate(8deg); }
        36% { transform: rotate(-8deg); }
        48% { transform: rotate(7deg); }
        60% { transform: rotate(-4deg); }
        72% { transform: rotate(0deg); }
      }
      @keyframes swayL {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(2deg); }
      }
      @keyframes swayR {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-2deg); }
      }
      @keyframes glareShift {
        0%, 100% { opacity: 0.35; transform: translateX(0px); }
        50% { opacity: 0.7; transform: translateX(2.5px); }
      }
      @keyframes sparkBob {
        0%, 100% { transform: translateY(0px) scale(0.9); opacity: 0.6; }
        50% { transform: translateY(-6px) scale(1.1); opacity: 0.95; }
      }
    </style>
  </defs>

  <!-- Ambient Micro Sparks (Clean, Tech Vibe) -->
  <g class="spark-1" transform="translate(50, 130)">
    <path d="M0 -9 Q1.5 -1.5 9 0 Q1.5 1.5 0 9 Q-1.5 1.5 -9 0 Q-1.5 -1.5 0 -9 Z" fill="#F59E0B"/>
  </g>
  <g class="spark-2" transform="translate(470, 150)">
    <path d="M0 -11 Q2 -2 11 0 Q2 2 0 11 Q-2 2 -11 0 Q-2 -2 0 -11 Z" fill="#10B981"/>
  </g>
  <circle cx="75" cy="245" r="3.5" fill="#38BDF8" opacity="0.8"/>
  <circle cx="450" cy="85" r="3" fill="#FBBF24" opacity="0.8"/>

  <!-- Character Root -->
  <g class="char-root" filter="url(#charDrop)">

    <!-- ==================== HOODIE & SHOULDERS ==================== -->
    <g id="bodyGroup">
      <!-- Back Hood Inside (Behind Neck) -->
      <path d="M 135 350 C 135 300, 345 300, 345 350 C 360 410, 120 410, 135 350 Z" fill="url(#hoodieInner)"/>

      <!-- Main Torso & Left Shoulder -->
      <path d="M 100 475 C 104 405, 140 358, 188 346 C 205 342, 275 342, 292 346 C 340 358, 376 405, 380 475 C 382 505, 360 535, 325 538 L 155 538 C 120 535, 98 505, 100 475 Z" fill="url(#hoodieBody)"/>

      <!-- Under-Arm Shadow Creases -->
      <path d="M 100 475 C 112 435, 138 395, 175 382 C 162 425, 152 478, 146 538 L 122 538 C 108 525, 102 502, 100 475 Z" fill="#034D37" opacity="0.45"/>
      <path d="M 380 475 C 368 435, 342 395, 305 382 C 318 425, 328 478, 334 538 L 358 538 C 372 525, 378 502, 380 475 Z" fill="#034D37" opacity="0.45"/>

      <!-- Thick 3D Folded Hood Rim around Neck -->
      <path d="M 170 340 C 160 375, 185 422, 240 422 C 295 422, 320 375, 310 340 C 332 365, 325 415, 295 432 C 265 448, 215 448, 185 432 C 155 415, 148 365, 170 340 Z" fill="url(#hoodieCollar)"/>

      <!-- Collar Front Gap Shadow -->
      <path d="M 188 346 C 205 378, 225 396, 240 396 C 255 396, 275 378, 292 346 C 298 360, 296 390, 278 406 C 262 418, 218 418, 202 406 C 184 390, 182 360, 188 346 Z" fill="#034531"/>

      <!-- Exposed Neck -->
      <path d="M 212 328 L 212 364 C 212 378, 268 378, 268 364 L 268 328 Z" fill="#E5A683"/>
      <path d="M 216 335 L 216 360 C 216 372, 264 372, 264 360 L 264 335 Z" fill="#F0B998"/>

      <!-- Zipper Line -->
      <path d="M 240 432 L 240 538" stroke="#03533B" stroke-width="2.5" stroke-dasharray="4 2"/>

      <!-- JalaninWeb Modern Ribbon Emblem -->
      <g transform="translate(240, 482) scale(0.68)">
        <path d="M -20 -9 C -11 -20, -2 -13, 0 -5 C 2 -13, 11 -20, 20 -9 C 25 -2, 22 9, 11 15 L 0 22 L -11 15 C -22 9, -25 -2, -20 -9 Z" fill="#FCD34D"/>
        <path d="M -15 -5 C -7 -14, 0 -7, 0 0 C 0 -7, 7 -14, 15 -5 C 18 1, 15 8, 7 13 L 0 18 L -7 13 C -15 8, -18 1, -15 -5 Z" fill="#10B981"/>
      </g>

      <!-- Drawstring L -->
      <g class="string-l">
        <path d="M 208 390 C 204 425, 202 455, 206 480" fill="none" stroke="#F8FAFC" stroke-width="4.5" stroke-linecap="round"/>
        <rect x="203" y="480" width="6" height="14" rx="3" fill="#94A3B8"/>
        <rect x="204" y="482" width="2" height="10" rx="1" fill="#FFFFFF" opacity="0.8"/>
      </g>

      <!-- Drawstring R -->
      <g class="string-r">
        <path d="M 272 390 C 276 425, 278 455, 274 480" fill="none" stroke="#F8FAFC" stroke-width="4.5" stroke-linecap="round"/>
        <rect x="271" y="480" width="6" height="14" rx="3" fill="#94A3B8"/>
        <rect x="272" y="482" width="2" height="10" rx="1" fill="#FFFFFF" opacity="0.8"/>
      </g>
    </g>

    <!-- ==================== WAVING RIGHT ARM & HAND ==================== -->
    <g class="hand-wave-group">
      <!-- Right Sleeve Raised Up -->
      <path d="M 330 370 C 345 350, 375 305, 395 270 C 410 278, 425 290, 415 320 C 395 365, 365 410, 335 430 Z" fill="url(#hoodieSleeve)"/>
      <!-- Sleeve Cuff -->
      <ellipse cx="395" cy="270" rx="18" ry="11" transform="rotate(-35 395 270)" fill="#047857"/>

      <!-- Forearm & Hand Waving -->
      <g class="hand-palm">
        <!-- Forearm Skin -->
        <path d="M 388 266 L 415 215 C 420 205, 435 212, 432 225 L 406 278 Z" fill="url(#handSkin)"/>

        <!-- Waving Palm & Fingers -->
        <!-- Palm Base -->
        <ellipse cx="425" cy="202" rx="19" ry="21" fill="url(#handSkin)"/>
        
        <!-- Thumb -->
        <path d="M 408 214 C 398 210, 396 198, 404 194 C 412 190, 416 198, 416 208 Z" fill="url(#handSkin)"/>

        <!-- 4 Cute Chibi Rounded Fingers -->
        <!-- Index Finger -->
        <path d="M 412 188 C 410 172, 420 166, 424 172 C 428 178, 426 190, 422 195 Z" fill="url(#handSkin)"/>
        <!-- Middle Finger (Tallest) -->
        <path d="M 423 186 C 424 168, 435 162, 439 168 C 443 175, 439 188, 434 195 Z" fill="url(#handSkin)"/>
        <!-- Ring Finger -->
        <path d="M 434 188 C 438 172, 448 168, 451 174 C 454 182, 448 192, 443 197 Z" fill="url(#handSkin)"/>
        <!-- Pinky Finger -->
        <path d="M 444 194 C 450 182, 458 180, 460 186 C 462 194, 455 204, 448 206 Z" fill="url(#handSkin)"/>

        <!-- Palm Highlight / Blush -->
        <ellipse cx="426" cy="204" rx="10" ry="11" fill="#FF8A8A" opacity="0.25"/>
      </g>
    </g>

    <!-- ==================== HEAD & FACE ==================== -->
    <g class="head-group">

      <!-- Back Hair Base Volume Silhouette -->
      <path d="M 120 225 C 104 140, 148 50, 240 46 C 332 50, 376 140, 360 225 C 372 285, 350 325, 332 332 C 300 326, 280 338, 240 338 C 200 338, 180 326, 148 332 C 130 325, 108 285, 120 225 Z" fill="url(#hairBase)"/>

      <!-- Left Ear -->
      <g id="earL">
        <ellipse cx="135" cy="242" rx="21" ry="26" transform="rotate(-6 135 242)" fill="url(#earGrad)"/>
        <path d="M 142 232 C 130 234, 128 252, 136 256 C 138 248, 142 242, 145 240" fill="none" stroke="#DB8E6B" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Right Ear -->
      <g id="earR">
        <ellipse cx="345" cy="242" rx="21" ry="26" transform="rotate(6 345 242)" fill="url(#earGrad)"/>
        <path d="M 338 232 C 350 234, 352 252, 344 256 C 342 248, 338 242, 335 240" fill="none" stroke="#DB8E6B" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Face Main Shape (Soft chubby cute 3D proportions) -->
      <path d="M 146 215 C 142 145, 185 125, 240 125 C 295 125, 338 145, 334 215 C 334 275, 328 322, 286 334 C 265 340, 215 340, 194 334 C 152 322, 146 275, 146 215 Z" fill="url(#skinGrad)"/>

      <!-- Cheeks Blush Glow -->
      <ellipse cx="174" cy="272" rx="25" ry="16" fill="url(#cheekBlush)"/>
      <ellipse cx="306" cy="272" rx="25" ry="16" fill="url(#cheekBlush)"/>

      <!-- Cute Small 3D Nose -->
      <path d="M 234 248 C 237 254, 243 254, 246 248" fill="none" stroke="#DE9270" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="240" cy="245" rx="4" ry="2.5" fill="#F8B190" opacity="0.75"/>

      <!-- Friendly Cute Warm Open Smile -->
      <g id="cuteSmile">
        <!-- Open Smile Mouth Cave -->
        <path d="M 219 269 Q 240 273 261 269 C 259 287, 221 287, 219 269 Z" fill="#881337"/>
        <!-- Soft Tongue Glow -->
        <path d="M 226 276 Q 240 273 254 276 C 251 285, 229 285, 226 276 Z" fill="#FB7185"/>
        <!-- Cute White Upper Teeth Tip -->
        <path d="M 228 270 Q 240 273 252 270 C 250 272.5, 230 272.5, 228 270 Z" fill="#FFFFFF"/>
        <!-- Upper Smile Lip Curve -->
        <path d="M 216 268 Q 240 273 264 268" fill="none" stroke="#5A081D" stroke-width="3.5" stroke-linecap="round"/>
        <!-- Dimple Creases -->
        <path d="M 213 266 C 214 269, 216 271, 218 271" fill="none" stroke="#BE123C" stroke-width="2" stroke-linecap="round"/>
        <path d="M 267 266 C 266 269, 264 271, 262 271" fill="none" stroke="#BE123C" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- ==================== EYES (BIG, ROUND, SPARKLING) ==================== -->
      <!-- Left Eye -->
      <g id="eyeL" transform="translate(185, 224)">
        <g class="eye-blink-wrapper">
          <ellipse cx="0" cy="0" rx="20.5" ry="23.5" fill="#FFFFFF"/>
          <ellipse cx="1" cy="0" rx="16.5" ry="18.5" fill="url(#irisGrad)"/>
          <ellipse cx="1.5" cy="0" rx="9" ry="10.5" fill="#0A0806"/>
          <ellipse cx="-4.5" cy="-5.5" rx="6.5" ry="7.5" fill="#FFFFFF"/>
          <circle cx="5.5" cy="4.5" r="3" fill="#FFFFFF" opacity="0.9"/>
          <path d="M -8 6 C -4 12, 6 12, 9 6" fill="none" stroke="#A16207" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
        </g>
      </g>

      <!-- Right Eye -->
      <g id="eyeR" transform="translate(295, 224)">
        <g class="eye-blink-wrapper">
          <ellipse cx="0" cy="0" rx="20.5" ry="23.5" fill="#FFFFFF"/>
          <ellipse cx="-1" cy="0" rx="16.5" ry="18.5" fill="url(#irisGrad)"/>
          <ellipse cx="-1.5" cy="0" rx="9" ry="10.5" fill="#0A0806"/>
          <ellipse cx="-6.5" cy="-5.5" rx="6.5" ry="7.5" fill="#FFFFFF"/>
          <circle cx="3.5" cy="4.5" r="3" fill="#FFFFFF" opacity="0.9"/>
          <path d="M -9 6 C -6 12, 4 12, 8 6" fill="none" stroke="#A16207" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
        </g>
      </g>

      <!-- Soft Eyebrows -->
      <path d="M 162 176 C 174 167, 198 167, 208 175" fill="none" stroke="#241E1A" stroke-width="5" stroke-linecap="round"/>
      <path d="M 272 175 C 282 167, 306 167, 318 176" fill="none" stroke="#241E1A" stroke-width="5" stroke-linecap="round"/>

      <!-- ==================== ROUND BLACK GLASSES ==================== -->
      <g id="glasses">
        <path d="M 216 222 C 228 215, 252 215, 264 222" fill="none" stroke="#18181B" stroke-width="5.5" stroke-linecap="round"/>

        <!-- Left Rim -->
        <circle cx="185" cy="224" r="33" fill="none" stroke="#18181B" stroke-width="5.5"/>
        <circle cx="185" cy="224" r="30" fill="#38BDF8" fill-opacity="0.04"/>
        <path class="glare-sweep" d="M 162 202 C 175 195, 198 198, 208 208 C 200 209, 180 207, 162 202 Z" fill="url(#lensSheen)"/>

        <!-- Right Rim -->
        <circle cx="295" cy="224" r="33" fill="none" stroke="#18181B" stroke-width="5.5"/>
        <circle cx="295" cy="224" r="30" fill="#38BDF8" fill-opacity="0.04"/>
        <path class="glare-sweep" d="M 272 202 C 285 195, 308 198, 318 208 C 310 209, 290 207, 272 202 Z" fill="url(#lensSheen)"/>

        <!-- Arms -->
        <path d="M 152 223 L 135 228" fill="none" stroke="#18181B" stroke-width="4" stroke-linecap="round"/>
        <path d="M 328 223 L 345 228" fill="none" stroke="#18181B" stroke-width="4" stroke-linecap="round"/>
      </g>

      <!-- ==================== NATURAL TEXTURED WAVY BOY HAIR ==================== -->
      <g id="naturalHair">
        <!-- Top Crown Layer -->
        <path d="M 126 210 C 112 135, 158 52, 242 48 C 325 52, 368 135, 354 210 C 364 150, 330 70, 242 68 C 155 70, 120 150, 126 210 Z" fill="url(#hairHighlight)" opacity="0.65"/>

        <!-- Forehead Soft Hair Base Underlay -->
        <path d="M 142 170 C 155 130, 205 110, 240 115 C 275 110, 325 130, 338 170 C 325 155, 295 142, 265 146 C 245 148, 235 148, 215 146 C 185 142, 155 155, 142 170 Z" fill="#1C1814"/>

        <!-- Left Soft Wavy Bang (sweeping down from part) -->
        <path d="M 138 185 C 144 135, 185 115, 225 128 C 208 142, 198 168, 186 190 C 175 170, 158 162, 142 175 Z" fill="url(#hairMid)"/>

        <!-- Left-Center Strand (falling over left eyebrow) -->
        <path d="M 178 135 C 202 130, 225 145, 234 172 C 224 172, 212 182, 206 195 C 196 174, 186 156, 178 135 Z" fill="url(#hairBase)"/>

        <!-- Center Front Soft Fringe -->
        <path d="M 215 132 C 232 128, 250 135, 258 155 C 248 158, 238 168, 234 182 C 226 164, 220 148, 215 132 Z" fill="url(#hairStrandL)"/>

        <!-- Center-Right Parted Lock (natural downward curve) -->
        <path d="M 242 130 C 270 120, 295 132, 306 160 C 294 162, 280 174, 272 190 C 264 168, 252 148, 242 130 Z" fill="url(#hairStrandR)"/>

        <!-- Right Sweeping Bang -->
        <path d="M 278 132 C 310 130, 338 150, 344 186 C 334 170, 320 166, 306 176 C 298 160, 288 145, 278 132 Z" fill="url(#hairMid)"/>

        <!-- Sideburns -->
        <path d="M 142 205 C 138 222, 140 238, 146 244 C 148 232, 150 216, 154 208 Z" fill="#1A1613"/>
        <path d="M 338 205 C 342 222, 340 238, 334 244 C 332 232, 330 216, 326 208 Z" fill="#1A1613"/>

        <!-- Playful Top Cowlick Tufts -->
        <path d="M 234 52 C 228 28, 245 14, 260 20 C 254 28, 248 36, 242 50 Z" fill="url(#hairHighlight)"/>
        <path d="M 242 48 C 252 32, 268 24, 280 34 C 270 40, 262 48, 254 55 Z" fill="url(#hairBase)"/>
      </g>

    </g> <!-- End head-group -->

  </g> <!-- End char-root -->
</svg>
