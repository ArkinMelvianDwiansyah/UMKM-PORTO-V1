<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 325 56" fill="none">
  <!-- Minimalist Architectural Crest -->
  <rect x="2" y="4" width="48" height="48" rx="4" fill="#16261E" stroke="#B86B35" stroke-width="1.2"/>
  <!-- Sun / Moon Halo -->
  <circle cx="34" cy="16" r="4.5" stroke="#B86B35" stroke-width="1.2"/>
  <!-- A-Frame Cabin & Pine Silhouette -->
  <path d="M10 42L23 16L36 42" stroke="#F3EFE6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M16 42L23 28L30 42" stroke="#B86B35" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pine Tree Accent -->
  <path d="M37 25L32.5 32H41.5L37 25Z" fill="#B86B35"/>
  <path d="M37 30L31.5 38H42.5L37 30Z" fill="#F3EFE6"/>
  <line x1="37" y1="38" x2="37" y2="42" stroke="#F3EFE6" stroke-width="1.4"/>
  <!-- Horizon Line -->
  <line x1="7" y1="42" x2="45" y2="42" stroke="#B86B35" stroke-width="1.2"/>

  <!-- Editorial Wordmark with generous 325px viewBox so LEMBAHPINUS & subtitle never clip -->
  <text x="60" y="28" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="21" letter-spacing="0.02em" fill="#16261E">LEMBAH<tspan fill="#B86B35">PINUS</tspan></text>
  <text x="61" y="43" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="8.5" letter-spacing="0.12em" fill="#525E57">SANCTUARY • VILLA &amp; GLAMPING</text>
</svg>
